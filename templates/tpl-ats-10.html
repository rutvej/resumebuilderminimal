<style>.tpl-container{font-family:'Inter',sans-serif;color:#1e293b;padding:1.2rem;}.tpl-header{border-bottom:1px solid #1e293b;padding-bottom:0.6rem;margin-bottom:1rem;}.tpl-name{font-size:24px;font-weight:700;color:#0f172a;text-transform:uppercase;letter-spacing:0.05em;}.tpl-title{font-size:13px;color:#475569;font-weight:500;margin-top:0.15rem;}.tpl-contact{font-size:11px;color:#64748b;margin-top:0.35rem;display:flex;gap:0.8rem;flex-wrap:wrap;}.res-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#0f172a;border-bottom:1px solid #cbd5e1;padding-bottom:0.15rem;margin-bottom:0.5rem;}</style>
<div class="tpl-container"><header class="tpl-header"><div class="tpl-name">{{name}}</div><div class="tpl-title">{{title}}</div><div class="tpl-contact"><span>{{email}}</span> • <span>{{phone}}</span> • <span>{{location}}</span> • <span>{{website}}</span></div></header><main class="tpl-main">{{sections}}</main></div>
