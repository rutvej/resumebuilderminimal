<style>.tpl-container{font-family:'Inter',sans-serif;color:#0f172a;padding:1.2rem;}.tpl-header{background:#f8fafc;border:1px solid #e2e8f0;border-top:4px solid #4f46e5;padding:0.8rem 1rem;border-radius:6px;margin-bottom:1rem;}.tpl-name{font-size:22px;font-weight:800;color:#4f46e5;}.tpl-title{font-size:13px;color:#475569;font-weight:600;margin-top:0.1rem;}.tpl-contact{font-size:11px;color:#64748b;margin-top:0.4rem;display:flex;gap:0.8rem;flex-wrap:wrap;}.res-section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#4f46e5;border-bottom:1.5px solid #cbd5e1;padding-bottom:0.2rem;margin-bottom:0.6rem;}</style>
<div class="tpl-container"><header class="tpl-header"><div class="tpl-name">{{name}}</div><div class="tpl-title">{{title}}</div><div class="tpl-contact"><span>📧 {{email}}</span><span>📱 {{phone}}</span><span>📍 {{location}}</span><span>🌐 {{website}}</span></div></header><main class="tpl-main">{{sections}}</main></div>
