<style>
  .tpl08-container { font-family: 'Outfit', sans-serif; color: #0f172a; padding: 1.4rem; }
  .tpl08-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid #db2777; padding-bottom: 0.9rem; margin-bottom: 1.4rem; }
  .tpl08-name { font-size: 34px; font-weight: 900; color: #db2777; line-height: 1; letter-spacing: -0.02em; }
  .tpl08-title { font-size: 14px; color: #475569; font-weight: 600; margin-top: 0.25rem; }
  .tpl08-contact { font-size: 11px; color: #64748b; text-align: right; line-height: 1.4; }
  .tpl08-container .res-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #db2777; border-bottom: 1px solid #fbcfe8; padding-bottom: 0.2rem; margin-bottom: 0.6rem; }
</style>

<div class="tpl08-container">
  <header class="tpl08-header">
    <div>
      <div class="tpl08-name">{{name}}</div>
      <div class="tpl08-title">{{title}}</div>
    </div>
    <div class="tpl08-contact">
      <div>{{email}}</div>
      <div>{{phone}}</div>
      <div>{{location}}</div>
      <div>{{website}}</div>
    </div>
  </header>
  <main class="tpl08-main">
    {{sections}}
  </main>
</div>
