<style>
    .ats-sheet { font-family: 'Inter', sans-serif; color: #0f172a; line-height: 1.45; }
    .ats-header { border-bottom: 2px solid #059669; padding-bottom: 0.6rem; margin-bottom: 1rem; }
    .ats-name { font-size: 24px; font-weight: 800; color: #059669; text-transform: uppercase; letter-spacing: 0.04em; }
    .ats-title { font-size: 14px; font-weight: 600; color: #334155; margin-top: 0.2rem; }
    .ats-contact { font-size: 11px; color: #475569; margin-top: 0.4rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .res-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #cbd5e1; padding-bottom: 0.2rem; margin-bottom: 0.5rem; color: #059669; margin-top: 0.8rem; }
  </style>
  <div class=ats-sheet>
    <header class=ats-header>
      <div class=ats-name>{{name}}</div>
      <div class=ats-title>{{title}}</div>
      <div class=ats-contact>
        <span>{{email}}</span> • <span>{{phone}}</span> • <span>{{location}}</span> • <span>{{website}}</span>
      </div>
    </header>
    <main>
      {{sections}}
    </main>
  </div>
