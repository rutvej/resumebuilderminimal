<style>.tpl-container{font-family:'Outfit',sans-serif;color:#0f172a;padding:1.2rem;}.tpl-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #059669;padding-bottom:0.6rem;margin-bottom:1rem;}.tpl-name{font-size:25px;font-weight:800;color:#059669;text-transform:uppercase;}.tpl-title{font-size:13px;color:#334155;font-weight:600;}.tpl-contact{font-size:11px;color:#475569;text-align:right;}.tpl-contact div{margin-bottom:0.15rem;}.res-section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;background:#ecfdf5;padding:0.3rem 0.6rem;border-left:4px solid #059669;margin-bottom:0.6rem;color:#065f46;}</style>
<div class="tpl-container"><header class="tpl-header"><div><div class="tpl-name">{{name}}</div><div class="tpl-title">{{title}}</div></div><div class="tpl-contact"><div>{{email}}</div><div>{{phone}}</div><div>{{location}} | {{website}}</div></div></header><main class="tpl-main">{{sections}}</main></div>
