<style>.tpl-container{font-family:'Outfit',sans-serif;color:#0f172a;padding:0;}.tpl-header{background:linear-gradient(135deg,#7c5cfc,#4f46e5);color:#fff;padding:1.6rem 1.2rem;border-radius:0 0 16px 16px;margin-bottom:1.2rem;}.tpl-name{font-size:28px;font-weight:800;letter-spacing:0.02em;}.tpl-title{font-size:14px;color:#c7d2fe;font-weight:600;margin-top:0.2rem;}.tpl-contact{font-size:11px;color:#e0e7ff;margin-top:0.6rem;display:flex;gap:0.6rem;flex-wrap:wrap;}.tpl-chip{background:rgba(255,255,255,0.15);padding:0.2rem 0.6rem;border-radius:20px;backdrop-filter:blur(4px);}.tpl-body{padding:1.2rem;}.res-section-title{font-size:13px;font-weight:700;text-transform:uppercase;color:#7c5cfc;border-bottom:2px solid #7c5cfc;padding-bottom:0.2rem;margin-bottom:0.6rem;}</style>
<div class="tpl-container"><header class="tpl-header"><div class="tpl-name">{{name}}</div><div class="tpl-title">{{title}}</div><div class="tpl-contact"><span class="tpl-chip">{{email}}</span><span class="tpl-chip">{{phone}}</span><span class="tpl-chip">{{location}}</span><span class="tpl-chip">{{website}}</span></div></header><main class="tpl-body">{{sections}}</main></div>
