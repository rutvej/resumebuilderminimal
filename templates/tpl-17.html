<style>
  .t17-wrap { font-family: 'JetBrains Mono', monospace; color: #24292f; padding: 1.4rem; background: #ffffff; }
  .t17-head { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; padding: 1.2rem; margin-bottom: 1.4rem; }
  .t17-name { font-size: 23px; font-weight: 700; color: #0969da; }
  .t17-title { font-size: 13px; color: #57606a; margin-top: 0.2rem; }
  .t17-contact { font-size: 10.5px; color: #57606a; margin-top: 0.5rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .t17-wrap .res-section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #24292f; border-bottom: 2px solid #0969da; padding-bottom: 0.2rem; margin-bottom: 0.6rem; }
</style>

<div class="t17-wrap">
  <header class="t17-head">
    <div class="t17-name">📦 {{name}}</div>
    <div class="t17-title">// {{title}}</div>
    <div class="t17-contact">
      <span>📧 {{email}}</span>
      <span>📱 {{phone}}</span>
      <span>📍 {{location}}</span>
      <span>🌐 {{website}}</span>
    </div>
  </header>
  <main class="t17-main">
    {{sections}}
  </main>
</div>
