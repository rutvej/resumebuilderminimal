<style>.t01-wrap{font-family:'Inter',sans-serif;color:#0f172a;padding:1.4rem;background:#f8fafc;}.t01-head{background:#ffffff;border:1px solid #e2e8f0;border-left:5px solid #6366f1;padding:1.2rem;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.04);margin-bottom:1.2rem;}.t01-name{font-size:25px;font-weight:800;color:#6366f1;}.t01-title{font-size:13.5px;color:#475569;font-weight:600;margin-top:0.2rem;}.t01-contact{font-size:11px;color:#64748b;margin-top:0.5rem;display:flex;gap:0.8rem;flex-wrap:wrap;}.res-section-title{font-size:13px;font-weight:700;text-transform:uppercase;color:#6366f1;background:#e0e7ff;padding:0.3rem 0.6rem;border-radius:4px;margin-bottom:0.6rem;display:inline-block;}</style>
<div class="t01-wrap"><header class="t01-head"><div class="t01-name">{{name}}</div><div class="t01-title">{{title}}</div><div class="t01-contact"><span>{{email}}</span> • <span>{{phone}}</span> • <span>{{location}}</span> • <span>{{website}}</span></div></header><main>{{sections}}</main></div>
