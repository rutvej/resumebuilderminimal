<style>.ats6-wrap{font-family:'Inter',sans-serif;color:#0f172a;padding:1rem;font-size:11px;}.ats6-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #0284c7;padding-bottom:0.4rem;margin-bottom:0.8rem;}.ats6-name{font-size:22px;font-weight:800;color:#0284c7;}.ats6-title{font-size:12px;font-weight:600;color:#475569;}.ats6-contact{font-size:10.5px;color:#64748b;display:flex;gap:0.6rem;}.res-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#0284c7;border-bottom:1px solid #e2e8f0;padding-bottom:0.15rem;margin-bottom:0.4rem;}</style>
<div class="ats6-wrap"><header class="ats6-head"><div><span class="ats6-name">{{name}}</span> | <span class="ats6-title">{{title}}</span></div><div class="ats6-contact"><span>{{email}}</span> • <span>{{phone}}</span> • <span>{{location}}</span></div></header><main>{{sections}}</main></div>
