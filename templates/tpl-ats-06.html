<style>.tpl-container{font-family:'Inter',sans-serif;color:#0f172a;padding:1rem;font-size:11px;}.tpl-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #0284c7;padding-bottom:0.4rem;margin-bottom:0.8rem;}.tpl-name{font-size:22px;font-weight:800;color:#0284c7;}.tpl-title{font-size:12px;font-weight:600;color:#475569;}.tpl-contact{font-size:10.5px;color:#64748b;display:flex;gap:0.6rem;}.res-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#0284c7;border-bottom:1px solid #e2e8f0;padding-bottom:0.15rem;margin-bottom:0.4rem;}</style>
<div class="tpl-container"><header class="tpl-header"><div><span class="tpl-name">{{name}}</span> | <span class="tpl-title">{{title}}</span></div><div class="tpl-contact"><span>{{email}}</span> • <span>{{phone}}</span> • <span>{{location}}</span></div></header><main class="tpl-main">{{sections}}</main></div>
