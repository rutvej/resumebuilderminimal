<style>
  .tpl07-container { font-family: 'Inter', sans-serif; color: #0f172a; padding: 1.4rem; border-left: 4px solid #ea580c; background: #fff5ed; border-radius: 0 12px 12px 0; }
  .tpl07-header { padding-left: 0.8rem; margin-bottom: 1.4rem; }
  .tpl07-name { font-size: 26px; font-weight: 800; color: #ea580c; text-transform: uppercase; letter-spacing: 0.02em; }
  .tpl07-title { font-size: 14px; color: #475569; font-weight: 600; margin-top: 0.2rem; }
  .tpl07-contact { font-size: 11px; color: #64748b; margin-top: 0.5rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .tpl07-container .res-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #ea580c; border-bottom: 1.5px solid #fdba74; padding-bottom: 0.2rem; margin-bottom: 0.6rem; }
</style>

<div class="tpl07-container">
  <header class="tpl07-header">
    <div class="tpl07-name">{{name}}</div>
    <div class="tpl07-title">{{title}}</div>
    <div class="tpl07-contact">
      <span>{{email}}</span><span>{{phone}}</span><span>{{location}}</span><span>{{website}}</span>
    </div>
  </header>
  <main class="tpl07-main">
    {{sections}}
  </main>
</div>
