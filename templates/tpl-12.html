<style>
  .t12-wrap { font-family: 'Outfit', sans-serif; color: #0f172a; padding: 1.4rem; background: #fafafa; }
  .t12-head { background: #0891b2; color: #ffffff; padding: 1.4rem; border-radius: 10px; margin-bottom: 1.2rem; box-shadow: 0 4px 14px rgba(8,145,178,0.2); }
  .t12-name { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .t12-title { font-size: 13.5px; color: #cffaff; font-weight: 600; margin-top: 0.2rem; }
  .t12-contact { font-size: 11px; color: #e0f2fe; margin-top: 0.5rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .t12-wrap .res-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #0891b2; border-bottom: 2px solid #0891b2; padding-bottom: 0.2rem; margin-bottom: 0.6rem; }
</style>

<div class="t12-wrap">
  <header class="t12-head">
    <div class="t12-name">{{name}}</div>
    <div class="t12-title">{{title}}</div>
    <div class="t12-contact">
      <span>📧 {{email}}</span><span>📱 {{phone}}</span><span>📍 {{location}}</span><span>🌐 {{website}}</span>
    </div>
  </header>
  <main class="t12-main">
    {{sections}}
  </main>
</div>
