<style>
.tpl2026-wrap {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  color: #0f172a;
  padding: calc(1.4rem * var(--scale-factor, 1.0));
  background: #ffffff;
  line-height: calc(1.45 * var(--scale-factor, 1.0));
  box-sizing: border-box;
}
.tpl2026-head {
  border-left: calc(4px * var(--scale-factor, 1.0)) solid var(--doc-accent, #6366f1);
  padding-left: calc(0.9rem * var(--scale-factor, 1.0));
  margin-bottom: calc(1.1rem * var(--scale-factor, 1.0));
}
.tpl2026-name {
  font-size: calc(24px * var(--scale-factor, 1.0));
  font-weight: 800;
  color: #0f172a;
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.tpl2026-title {
  font-size: calc(13.5px * var(--scale-factor, 1.0));
  color: var(--doc-accent, #6366f1);
  font-weight: 600;
  margin-top: calc(0.2rem * var(--scale-factor, 1.0));
}
.tpl2026-contact {
  font-size: calc(11px * var(--scale-factor, 1.0));
  color: #64748b;
  margin-top: calc(0.45rem * var(--scale-factor, 1.0));
  display: flex;
  gap: calc(0.75rem * var(--scale-factor, 1.0));
  flex-wrap: wrap;
}
.tpl2026-contact span:not(:last-child)::after {
  content: " •";
  color: #cbd5e1;
  margin-left: calc(0.75rem * var(--scale-factor, 1.0));
}
.res-section {
  margin-bottom: calc(1rem * var(--scale-factor, 1.0));
  page-break-inside: avoid;
}
.res-section-title {
  font-size: calc(12.5px * var(--scale-factor, 1.0));
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--doc-accent, #6366f1);
  border-bottom: calc(1.5px * var(--scale-factor, 1.0)) solid var(--doc-accent, #6366f1);
  padding-bottom: calc(0.25rem * var(--scale-factor, 1.0));
  margin-bottom: calc(0.55rem * var(--scale-factor, 1.0));
}
.res-item {
  margin-bottom: calc(0.5rem * var(--scale-factor, 1.0));
  page-break-inside: avoid;
}
.res-item-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-weight: 600;
  font-size: calc(12px * var(--scale-factor, 1.0));
}
.res-item-role {
  color: #0f172a;
}
.res-item-sub {
  color: #475569;
  font-weight: 500;
}
.res-item-date {
  color: #64748b;
  font-weight: 400;
  font-size: calc(11px * var(--scale-factor, 1.0));
}
.res-bullets {
  padding-left: calc(1.1rem * var(--scale-factor, 1.0));
  margin-top: calc(0.2rem * var(--scale-factor, 1.0));
  color: #334155;
  font-size: calc(11.5px * var(--scale-factor, 1.0));
}
.res-bullets li {
  margin-bottom: calc(0.2rem * var(--scale-factor, 1.0));
}
.res-text {
  color: #334155;
  font-size: calc(11.5px * var(--scale-factor, 1.0));
}
</style>
<div class="tpl2026-wrap">
  <header class="tpl2026-head">
    <div class="tpl2026-name">{{name}}</div>
    <div class="tpl2026-title">{{title}}</div>
    <div class="tpl2026-contact">
      <span>{{email}}</span>
      <span>{{phone}}</span>
      <span>{{location}}</span>
      <span>{{website}}</span>
    </div>
  </header>
  <main>{{sections}}</main>
</div>
