<style>.tpl-container{font-family:'Inter',sans-serif;color:#0f172a;padding:1.2rem;display:flex;gap:1.2rem;min-height:100%;}.tpl-left-col{width:32%;border-right:2px solid #e2e8f0;padding-right:1rem;}.tpl-right-col{width:68%;}.tpl-name{font-size:22px;font-weight:900;color:#2563eb;line-height:1.1;}.tpl-title{font-size:12px;font-weight:600;color:#64748b;margin-top:0.3rem;}.tpl-contact{font-size:11px;color:#475569;margin-top:1rem;display:flex;flex-direction:column;gap:0.4rem;}.res-section-title{font-size:12px;font-weight:700;text-transform:uppercase;color:#2563eb;border-bottom:1.5px solid #2563eb;padding-bottom:0.2rem;margin-bottom:0.5rem;}</style>
<div class="tpl-container"><aside class="tpl-left-col"><div class="tpl-name">{{name}}</div><div class="tpl-title">{{title}}</div><div class="tpl-contact"><div>📧 {{email}}</div><div>📱 {{phone}}</div><div>📍 {{location}}</div><div>🌐 {{website}}</div></div></aside><main class="tpl-right-col">{{sections}}</main></div>
