<style>
      .tpl-container { font-family: 'Inter', sans-serif; color: #0f172a; padding: 1.2rem; }
      .tpl-header { border-left: 4px solid #6d28d9; padding-left: 0.8rem; margin-bottom: 1rem; }
      .tpl-name { font-size: 24px; font-weight: 800; color: #6d28d9; text-transform: uppercase; line-height: 1.1; }
      .tpl-title { font-size: 14px; color: #475569; font-weight: 500; margin-top: 0.2rem; }
      .tpl-contact { font-size: 11px; color: #64748b; margin-top: 0.4rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
      .tpl-main .res-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.2rem; margin-bottom: 0.6rem; color: #6d28d9; }
    </style>

      <div class=tpl-container>
        <header class=tpl-header>
          <div class=tpl-name>{{name}}</div>
          <div class=tpl-title>{{title}}</div>
          <div class=tpl-contact>
            <span>{{email}}</span> <span>{{phone}}</span> <span>{{location}}</span> <span>{{website}}</span>
          </div>
        </header>
        <main class=tpl-main>
          {{sections}}
        </main>
      </div>
