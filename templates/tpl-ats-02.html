<style>
.ats2-wrap{font-family:'Merriweather',serif;color:#1e293b;padding:calc(1.2rem * var(--scale-factor, 1.0));line-height:calc(1.5 * var(--scale-factor, 1.0));}
.ats2-head{text-align:center;border-bottom:calc(2px * var(--scale-factor, 1.0)) double #0f172a;padding-bottom:calc(0.8rem * var(--scale-factor, 1.0));margin-bottom:calc(1rem * var(--scale-factor, 1.0));}
.ats2-name{font-size:calc(26px * var(--scale-factor, 1.0));font-weight:700;color:#0f172a;letter-spacing:0.06em;text-transform:uppercase;}
.ats2-title{font-size:calc(13px * var(--scale-factor, 1.0));color:#475569;font-style:italic;margin-top:calc(0.25rem * var(--scale-factor, 1.0));}
.ats2-contact{font-size:calc(11px * var(--scale-factor, 1.0));color:#475569;margin-top:calc(0.4rem * var(--scale-factor, 1.0));display:flex;justify-content:center;gap:calc(0.6rem * var(--scale-factor, 1.0));flex-wrap:wrap;}
.ats2-contact span:not(:last-child)::after{content:" |";color:#94a3b8;margin-left:calc(0.6rem * var(--scale-factor, 1.0));}
.res-section-title{font-size:calc(13px * var(--scale-factor, 1.0));font-weight:700;text-transform:uppercase;letter-spacing:0.08em;text-align:center;border-top:calc(1px * var(--scale-factor, 1.0)) solid #cbd5e1;border-bottom:calc(1px * var(--scale-factor, 1.0)) solid #cbd5e1;padding:calc(0.25rem * var(--scale-factor, 1.0)) 0;margin-bottom:calc(0.6rem * var(--scale-factor, 1.0));color:#0f172a;}
</style>
<div class="ats2-wrap"><header class="ats2-head"><div class="ats2-name">{{name}}</div><div class="ats2-title">{{title}}</div><div class="ats2-contact"><span>{{email}}</span><span>{{phone}}</span><span>{{location}}</span><span>{{website}}</span></div></header><main>{{sections}}</main></div>
