<style>.ats2-wrap{font-family:'Merriweather',serif;color:#1e293b;padding:1.2rem;line-height:1.5;}.ats2-head{text-align:center;border-bottom:2px double #0f172a;padding-bottom:0.8rem;margin-bottom:1rem;}.ats2-name{font-size:26px;font-weight:700;color:#0f172a;letter-spacing:0.06em;text-transform:uppercase;}.ats2-title{font-size:13px;color:#475569;font-style:italic;margin-top:0.25rem;}.ats2-contact{font-size:11px;color:#475569;margin-top:0.4rem;display:flex;justify-content:center;gap:0.6rem;flex-wrap:wrap;}.ats2-contact span:not(:last-child)::after{content:" |";color:#94a3b8;margin-left:0.6rem;}.res-section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;text-align:center;border-top:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;padding:0.25rem 0;margin-bottom:0.6rem;color:#0f172a;}</style>
