<style>
  .t18-wrap { font-family: 'Outfit', sans-serif; color: #0f172a; padding: 1.4rem; }
  .t18-head { margin-bottom: 1.4rem; }
  .t18-name { font-size: 28px; font-weight: 800; color: #8b5cf6; line-height: 1.1; }
  .t18-title { font-size: 14px; color: #6d28d9; font-weight: 600; margin-top: 0.2rem; }
  .t18-contact { font-size: 11px; color: #5b21b6; margin-top: 0.6rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .t18-chip { background: #f5f3ff; border: 1px solid #ddd6fe; padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: 500; }
  .t18-wrap .res-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #8b5cf6; border-bottom: 2px solid #8b5cf6; padding-bottom: 0.2rem; margin-bottom: 0.6rem; }
</style>

<div class="t18-wrap">
  <header class="t18-head">
    <div class="t18-name">{{name}}</div>
    <div class="t18-title">{{title}}</div>
    <div class="t18-contact">
      <span class="t18-chip">{{email}}</span>
      <span class="t18-chip">{{phone}}</span>
      <span class="t18-chip">{{location}}</span>
      <span class="t18-chip">{{website}}</span>
    </div>
  </header>
  <main class="t18-main">
    {{sections}}
  </main>
</div>
