<style>.tpl-container{font-family:'Inter',sans-serif;color:#0f172a;padding:1.2rem;line-height:1.45;}.tpl-header{border-left:5px solid #1e3a8a;padding-left:0.8rem;margin-bottom:1rem;}.tpl-name{font-size:24px;font-weight:800;color:#1e3a8a;text-transform:uppercase;letter-spacing:0.03em;}.tpl-title{font-size:14px;color:#475569;font-weight:600;margin-top:0.15rem;}.tpl-contact{font-size:11px;color:#64748b;margin-top:0.4rem;display:flex;gap:0.8rem;flex-wrap:wrap;}.tpl-contact span:not(:last-child)::after{content:" •";color:#cbd5e1;margin-left:0.8rem;}.res-section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;border-bottom:2px solid #1e3a8a;padding-bottom:0.2rem;margin-bottom:0.6rem;color:#1e3a8a;}</style>
<div class="tpl-container"><header class="tpl-header"><div class="tpl-name">{{name}}</div><div class="tpl-title">{{title}}</div><div class="tpl-contact"><span>{{email}}</span><span>{{phone}}</span><span>{{location}}</span><span>{{website}}</span></div></header><main class="tpl-main">{{sections}}</main></div>
