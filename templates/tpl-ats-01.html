<style>
.ats1-wrap{font-family:'Inter',sans-serif;color:#0f172a;padding:calc(1.2rem * var(--scale-factor, 1.0));line-height:calc(1.45 * var(--scale-factor, 1.0));}
.ats1-head{border-left:calc(5px * var(--scale-factor, 1.0)) solid var(--doc-accent, #1e3a8a);padding-left:calc(0.8rem * var(--scale-factor, 1.0));margin-bottom:calc(1rem * var(--scale-factor, 1.0));}
.ats1-name{font-size:calc(24px * var(--scale-factor, 1.0));font-weight:800;color:var(--doc-accent, #1e3a8a);text-transform:uppercase;letter-spacing:0.03em;}
.ats1-title{font-size:calc(14px * var(--scale-factor, 1.0));color:#475569;font-weight:600;margin-top:calc(0.15rem * var(--scale-factor, 1.0));}
.ats1-contact{font-size:calc(11px * var(--scale-factor, 1.0));color:#64748b;margin-top:calc(0.4rem * var(--scale-factor, 1.0));display:flex;gap:calc(0.8rem * var(--scale-factor, 1.0));flex-wrap:wrap;}
.ats1-contact span:not(:last-child)::after{content:" •";color:#cbd5e1;margin-left:calc(0.8rem * var(--scale-factor, 1.0));}
.res-section-title{font-size:calc(13px * var(--scale-factor, 1.0));font-weight:700;text-transform:uppercase;letter-spacing:0.05em;border-bottom:calc(2px * var(--scale-factor, 1.0)) solid var(--doc-accent, #1e3a8a);padding-bottom:calc(0.2rem * var(--scale-factor, 1.0));margin-bottom:calc(0.6rem * var(--scale-factor, 1.0));color:var(--doc-accent, #1e3a8a);}
</style>
<div class="ats1-wrap"><header class="ats1-head"><div class="ats1-name">{{name}}</div><div class="ats1-title">{{title}}</div><div class="ats1-contact"><span>{{email}}</span><span>{{phone}}</span><span>{{location}}</span><span>{{website}}</span></div></header><main>{{sections}}</main></div>
