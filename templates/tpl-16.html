<style>
  .t16-wrap { font-family: 'Merriweather', serif; color: #1c1917; padding: 1.4rem; background: #fff5f5; }
  .t16-head { text-align: center; border-top: 3px solid #7f1d1d; border-bottom: 2px double #7f1d1d; padding: 1.2rem 0; margin-bottom: 1.4rem; }
  .t16-name { font-size: 26px; font-weight: 700; color: #7f1d1d; letter-spacing: 0.04em; text-transform: uppercase; }
  .t16-title { font-size: 13px; font-style: italic; color: #991b1b; margin-top: 0.2rem; }
  .t16-contact { font-size: 11px; color: #57534e; margin-top: 0.5rem; display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; }
  .t16-contact span:not(:last-child)::after { content: " | "; color: #b91c1c; margin-left: 0.8rem; }
  .t16-wrap .res-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid #fca5a5; padding-bottom: 0.2rem; margin-bottom: 0.6rem; color: #7f1d1d; }
</style>

<div class="t16-wrap">
  <header class="t16-head">
    <div class="t16-name">{{name}}</div>
    <div class="t16-title">{{title}}</div>
    <div class="t16-contact">
      <span>{{email}}</span><span>{{phone}}</span><span>{{location}}</span><span>{{website}}</span>
    </div>
  </header>
  <main class="t16-main">
    {{sections}}
  </main>
</div>
