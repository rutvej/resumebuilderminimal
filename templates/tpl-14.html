<style>
  .t14-wrap { font-family: 'JetBrains Mono', monospace; color: #0f172a; padding: 1.4rem; }
  .t14-head { background: #0f172a; color: #f8fafc; padding: 1.2rem; border-radius: 8px; border-top: 4px solid #10b981; margin-bottom: 1.4rem; box-shadow: 0 4px 14px rgba(15,23,42,0.25); }
  .t14-name { font-size: 24px; font-weight: 700; color: #10b981; }
  .t14-title { font-size: 13px; color: #94a3b8; margin-top: 0.2rem; }
  .t14-contact { font-size: 10.5px; color: #cbd5e1; margin-top: 0.5rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .t14-wrap .res-section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #0f172a; border-bottom: 2px solid #10b981; padding-bottom: 0.2rem; margin-bottom: 0.6rem; }
</style>

<div class="t14-wrap">
  <header class="t14-head">
    <div class="t14-name">[SEC] {{name}}</div>
    <div class="t14-title">// {{title}}</div>
    <div class="t14-contact">
      <span>[{{email}}]</span>
      <span>[{{phone}}]</span>
      <span>[{{location}}]</span>
      <span>[{{website}}]</span>
    </div>
  </header>
  <main class="t14-main">
    {{sections}}
  </main>
</div>
