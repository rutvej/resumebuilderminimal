<style>.tpl-container{font-family:'Merriweather',serif;color:#111827;padding:1.2rem;font-size:11px;}.tpl-header{text-align:center;margin-bottom:1.2rem;}.tpl-name{font-size:24px;font-weight:700;color:#991b1b;text-transform:uppercase;letter-spacing:0.05em;}.tpl-title{font-size:12px;font-weight:400;font-style:italic;color:#374151;margin-top:0.2rem;}.tpl-contact{font-size:10.5px;color:#4b5563;margin-top:0.35rem;display:flex;justify-content:center;gap:0.5rem;}.tpl-contact span:not(:last-child)::after{content:" | ";color:#9ca3af;}.res-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;border-bottom:1px solid #111827;padding-bottom:0.15rem;margin-bottom:0.5rem;color:#111827;}</style>
<div class="tpl-container"><header class="tpl-header"><div class="tpl-name">{{name}}</div><div class="tpl-title">{{title}}</div><div class="tpl-contact"><span>{{email}}</span><span>{{phone}}</span><span>{{location}}</span><span>{{website}}</span></div></header><main class="tpl-main">{{sections}}</main></div>
