<style>
  .tpl10-container { font-family: 'Inter', sans-serif; color: #0f172a; padding: 0; }
  .tpl10-header { background: #1e1b4b; color: #ffffff; padding: 1.6rem 1.4rem; border-bottom: 5px solid #d97706; }
  .tpl10-name { font-size: 27px; font-weight: 800; color: #fbbf24; text-transform: uppercase; letter-spacing: 0.04em; }
  .tpl10-title { font-size: 13.5px; color: #fef3c7; font-weight: 600; margin-top: 0.25rem; }
  .tpl10-contact { font-size: 11px; color: #e0e7ff; margin-top: 0.55rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .tpl10-body { padding: 1.4rem; }
  .tpl10-container .res-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #1e1b4b; border-bottom: 2px solid #d97706; padding-bottom: 0.2rem; margin-bottom: 0.6rem; }
</style>

<div class="tpl10-container">
  <header class="tpl10-header">
    <div class="tpl10-name">{{name}}</div>
    <div class="tpl10-title">{{title}}</div>
    <div class="tpl10-contact">
      <span>{{email}}</span> • <span>{{phone}}</span> • <span>{{location}}</span> • <span>{{website}}</span>
    </div>
  </header>
  <main class="tpl10-body">
    {{sections}}
  </main>
</div>
