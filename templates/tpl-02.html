<style>.tpl-container{font-family:'Merriweather',serif;color:#1c1917;padding:1.2rem;line-height:1.5;}.tpl-header{text-align:center;border-top:3px solid #451a03;border-bottom:1px solid #451a03;padding:1rem 0;margin-bottom:1.2rem;}.tpl-name{font-size:26px;font-weight:700;color:#451a03;letter-spacing:0.05em;text-transform:uppercase;}.tpl-title{font-size:13px;font-style:italic;color:#78350f;margin-top:0.2rem;}.tpl-contact{font-size:11px;color:#57534e;margin-top:0.5rem;display:flex;justify-content:center;gap:0.8rem;}.res-section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid #d6d3d1;padding-bottom:0.2rem;margin-bottom:0.6rem;color:#451a03;}</style>
<div class="tpl-container"><header class="tpl-header"><div class="tpl-name">{{name}}</div><div class="tpl-title">{{title}}</div><div class="tpl-contact"><span>{{email}}</span> | <span>{{phone}}</span> | <span>{{location}}</span> | <span>{{website}}</span></div></header><main class="tpl-main">{{sections}}</main></div>
