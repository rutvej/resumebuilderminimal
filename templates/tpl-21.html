<style>
  .t21-wrap { font-family: 'Inter', sans-serif; color: #0f172a; padding: 1.4rem; }
  .t21-head { background: #f8fafc; border: 1px solid #cbd5e1; border-top: 4px solid #0d9488; padding: 1.2rem; border-radius: 8px; margin-bottom: 1.4rem; }
  .t21-badge { display: inline-block; background: #ccfbf1; color: #0f766e; font-size: 10px; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 12px; text-transform: uppercase; margin-bottom: 0.4rem; }
  .t21-name { font-size: 25px; font-weight: 800; color: #0f766e; }
  .t21-title { font-size: 13.5px; color: #475569; font-weight: 600; margin-top: 0.15rem; }
  .t21-contact { font-size: 11px; color: #64748b; margin-top: 0.5rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .t21-wrap .res-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #0f766e; border-bottom: 2px solid #0d9488; padding-bottom: 0.2rem; margin-bottom: 0.6rem; }
</style>

<div class="t21-wrap">
  <header class="t21-head">
    <span class="t21-badge">🌐 Global Remote Specialist</span>
    <div class="t21-name">{{name}}</div>
    <div class="t21-title">{{title}}</div>
    <div class="t21-contact">
      <span>📧 {{email}}</span> • <span>📱 {{phone}}</span> • <span>📍 {{location}}</span> • <span>🌐 {{website}}</span>
    </div>
  </header>
  <main class="t21-main">
    {{sections}}
  </main>
</div>
