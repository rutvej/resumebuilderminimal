<style>.tpl-container{font-family:'Inter',sans-serif;color:#1e1b4b;padding:1.2rem;}.tpl-header{text-align:center;border-bottom:1px solid #312e81;padding-bottom:0.6rem;margin-bottom:1rem;}.tpl-name{font-size:25px;font-weight:800;color:#312e81;letter-spacing:0.04em;text-transform:uppercase;}.tpl-title{font-size:13px;font-weight:600;color:#4338ca;margin-top:0.2rem;}.tpl-contact{font-size:11px;color:#475569;margin-top:0.4rem;display:flex;justify-content:center;gap:0.8rem;}.res-section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#312e81;border-bottom:1px solid #c7d2fe;padding-bottom:0.15rem;margin-bottom:0.6rem;}</style>
<div class="tpl-container"><header class="tpl-header"><div class="tpl-name">{{name}}</div><div class="tpl-title">{{title}}</div><div class="tpl-contact"><span>{{email}}</span> | <span>{{phone}}</span> | <span>{{location}}</span> | <span>{{website}}</span></div></header><main class="tpl-main">{{sections}}</main></div>
