<style>.tpl-container{font-family:'Merriweather',sans-serif;color:#0f172a;padding:1.2rem;}.tpl-header{border-bottom:2px solid #dc2626;padding-bottom:0.6rem;margin-bottom:1rem;}.tpl-name{font-size:24px;font-weight:800;color:#dc2626;text-transform:uppercase;}.tpl-title{font-size:13px;color:#475569;font-weight:600;margin-top:0.2rem;}.tpl-contact{font-size:11px;color:#64748b;margin-top:0.4rem;display:flex;gap:0.8rem;flex-wrap:wrap;}.res-section-title{font-size:13px;font-weight:700;text-transform:uppercase;color:#dc2626;border-left:4px solid #dc2626;padding-left:0.5rem;margin-bottom:0.6rem;}</style>
<div class="tpl-container"><header class="tpl-header"><div class="tpl-name">{{name}}</div><div class="tpl-title">{{title}}</div><div class="tpl-contact"><span>{{email}}</span><span>{{phone}}</span><span>{{location}}</span><span>{{website}}</span></div></header><main class="tpl-main">{{sections}}</main></div>
