<style>
  .tpl05-container { font-family: 'JetBrains Mono', monospace; color: #0f172a; padding: 1.4rem; background: #fafafa; }
  .tpl05-header { background: #18181b; color: #f4f4f5; padding: 1.2rem; border-radius: 8px; border-left: 5px solid #10b981; margin-bottom: 1.4rem; box-shadow: 0 4px 14px rgba(0,0,0,0.15); }
  .tpl05-name { font-size: 22px; font-weight: 700; color: #10b981; }
  .tpl05-title { font-size: 13px; color: #a1a1aa; margin-top: 0.2rem; }
  .tpl05-contact { font-size: 10.5px; color: #d4d4d8; margin-top: 0.6rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .tpl05-container .res-section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #18181b; border-bottom: 2px solid #10b981; padding-bottom: 0.2rem; margin-bottom: 0.6rem; }
</style>

<div class="tpl05-container">
  <header class="tpl05-header">
    <div class="tpl05-name">$ developer.load("{{name}}")</div>
    <div class="tpl05-title">// {{title}}</div>
    <div class="tpl05-contact">
      <span>[{{email}}]</span>
      <span>[{{phone}}]</span>
      <span>[{{location}}]</span>
      <span>[{{website}}]</span>
    </div>
  </header>
  <main class="tpl05-main">
    {{sections}}
  </main>
</div>
