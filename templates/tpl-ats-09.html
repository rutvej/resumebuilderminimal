<style>.tpl-container{font-family:'Outfit',sans-serif;color:#0f172a;padding:1.2rem;}.tpl-header{margin-bottom:1rem;}.tpl-name{font-size:26px;font-weight:800;color:#7c3aed;line-height:1.1;}.tpl-title{font-size:14px;color:#475569;font-weight:600;margin-top:0.2rem;}.tpl-contact{font-size:11px;color:#5b21b6;margin-top:0.5rem;display:flex;gap:0.4rem;flex-wrap:wrap;}.tpl-pill{background:#f5f3ff;border:1px solid #ddd6fe;padding:0.15rem 0.5rem;border-radius:4px;font-weight:500;}.res-section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#7c3aed;border-bottom:2px solid #7c3aed;padding-bottom:0.2rem;margin-bottom:0.6rem;}</style>
<div class="tpl-container"><header class="tpl-header"><div class="tpl-name">{{name}}</div><div class="tpl-title">{{title}}</div><div class="tpl-contact"><span class="tpl-pill">{{email}}</span><span class="tpl-pill">{{phone}}</span><span class="tpl-pill">{{location}}</span><span class="tpl-pill">{{website}}</span></div></header><main class="tpl-main">{{sections}}</main></div>
