<style>.t06-wrap{font-family:'Inter',sans-serif;color:#0f172a;padding:0;}.t06-head{background:#1e3a8a;color:#fff;padding:1.5rem 1.4rem;display:flex;align-items:center;gap:1.4rem;border-bottom:4px solid #3b82f6;}.t06-avatar{width:56px;height:56px;border-radius:50%;background:#ffffff;color:#1e3a8a;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid rgba(255,255,255,0.4);}.t06-name{font-size:25px;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;}.t06-title{font-size:13.5px;color:#93c5fd;font-weight:600;margin-top:0.15rem;}.t06-contact{font-size:11px;color:#cbd5e1;margin-top:0.35rem;display:flex;gap:0.8rem;flex-wrap:wrap;}.t06-body{padding:1.4rem;}.res-section-title{font-size:13px;font-weight:700;text-transform:uppercase;color:#1e3a8a;border-bottom:2px solid #1e3a8a;padding-bottom:0.25rem;margin-bottom:0.6rem;}</style>
<div class="t06-wrap"><header class="t06-head"><div class="t06-avatar">EX</div><div><div class="t06-name">{{name}}</div><div class="t06-title">{{title}}</div><div class="t06-contact"><span>{{email}}</span> • <span>{{phone}}</span> • <span>{{location}}</span> • <span>{{website}}</span></div></div></header><main class="t06-body">{{sections}}</main></div>
