<style>
  .t22-wrap { font-family: 'Outfit', sans-serif; color: #0f172a; padding: 1.4rem; }
  .t22-head { border-left: 6px solid #ea580c; padding-left: 1rem; margin-bottom: 1.4rem; background: #fff7ed; padding: 1.2rem; border-radius: 0 8px 8px 0; }
  .t22-name { font-size: 27px; font-weight: 900; color: #c2410c; text-transform: uppercase; letter-spacing: -0.01em; }
  .t22-title { font-size: 14px; color: #ea580c; font-weight: 600; margin-top: 0.2rem; }
  .t22-contact { font-size: 11px; color: #9a3412; margin-top: 0.5rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .t22-wrap .res-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #c2410c; border-bottom: 2px solid #ea580c; padding-bottom: 0.2rem; margin-bottom: 0.6rem; }
</style>

<div class="t22-wrap">
  <header class="t22-head">
    <div class="t22-name">{{name}}</div>
    <div class="t22-title">{{title}}</div>
    <div class="t22-contact">
      <span>{{email}}</span> • <span>{{phone}}</span> • <span>{{location}}</span> • <span>{{website}}</span>
    </div>
  </header>
  <main class="t22-main">
    {{sections}}
  </main>
</div>
